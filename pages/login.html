<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
</head>

<body>
    <%- include('./layout/header'); -%>
        <div class="login-top-md d-none d-md-block c-neutral-000">
            <div class="login-top-inner-md">
                <h2 class="mb-9">URBNSTEP</h2>
                <h6 class="c-neutral-500 t-h6">Your Step, Your Statement</h6>
            </div>
        </div>
        <section class="container py-64 py-24-md">
            <div class="row d-flex">
                <div class="col-5 d-md-none">
                    <div class="login-left">
                        <h1 class="dp2 c-neutral-000 mb-15">URBNSTEP</h1>
                        <h4 class="c-neutral-500 t-h4 text-end">Your Step, Your Statement</h4>
                    </div>
                </div>
                <div class="col-7 col-12-md">
                    <div class="login-right">
                        <h3 class="t-h3 mb-32 mb-24-md text-center">歡迎！</h3>
                        <div class="d-flex mb-32 mb-24-md login-use">
                            <button class="t-h6 wd50 py-12 login-btn active" data-type="login">登入</button>
                            <button class="t-h6 wd50 py-12 login-btn" data-type="register">註冊</button>
                        </div>
                        <ul class="login-block">
                            <li class="mb-8 bg-neutral-000 p-12 bd-radius bd-neutral-300"><a class="d-flex align-center"
                                    href="www.facebook.com">
                                    <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/6d666caf369e2de99b649ce9fc967d13e36f30b5/2025-week3-4/facebook.svg"
                                        alt="Facebook icon" class="me-12">
                                    <p class="t-pa-md c-neutral-900">Facebook 登入</p>
                                </a>
                            </li>
                            <li class="mb-8 bg-neutral-000 p-12 bd-radius bd-neutral-300"><a class="d-flex align-center"
                                    href="www.apple.com">
                                    <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/6d666caf369e2de99b649ce9fc967d13e36f30b5/2025-week3-4/apple.svg"
                                        alt="Facebook icon" class="me-12">
                                    <p class="t-pa-md c-neutral-900">Apple 登入</p>
                                </a>
                            </li>
                            <li class="mb-8 bg-neutral-000 p-12 bd-radius bd-neutral-300"><a class="d-flex align-center"
                                    href="www.google.com">
                                    <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/6d666caf369e2de99b649ce9fc967d13e36f30b5/2025-week3-4/google.svg"
                                        alt="Facebook icon" class="me-12">
                                    <p class="t-pa-md c-neutral-900">Google 登入</p>
                                </a>
                            </li>
                        </ul>
                        <ul class="register-block d-none">
                            <li class="mb-8 bg-neutral-000 p-12 bd-radius bd-neutral-300"><a class="d-flex align-center"
                                    href="www.facebook.com">
                                    <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/6d666caf369e2de99b649ce9fc967d13e36f30b5/2025-week3-4/facebook.svg"
                                        alt="Facebook icon" class="me-12">
                                    <p class="t-pa-md c-neutral-900">Facebook 註冊</p>
                                </a>
                            </li>
                            <li class="mb-8 bg-neutral-000 p-12 bd-radius bd-neutral-300"><a class="d-flex align-center"
                                    href="www.apple.com">
                                    <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/6d666caf369e2de99b649ce9fc967d13e36f30b5/2025-week3-4/apple.svg"
                                        alt="Facebook icon" class="me-12">
                                    <p class="t-pa-md c-neutral-900">Apple 註冊</p>
                                </a>
                            </li>
                            <li class="mb-8 bg-neutral-000 p-12 bd-radius bd-neutral-300"><a class="d-flex align-center"
                                    href="www.google.com">
                                    <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/6d666caf369e2de99b649ce9fc967d13e36f30b5/2025-week3-4/google.svg"
                                        alt="Facebook icon" class="me-12">
                                    <p class="t-pa-md c-neutral-900">Google 註冊</p>
                                </a>
                            </li>
                        </ul>
                    </div>

                </div>
            </div>

        </section>
        <%- include('./layout/footer1'); -%>

            <script type="module" src="../main.js"></script>
</body>

</html>
